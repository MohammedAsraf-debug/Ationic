    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        /* Shop Page Specific Styles */
        .shop-container {
            max-width: 1400px;
            margin: 100px auto 50px;
            padding: 0 20px;
        }
        
        .shop-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .shop-title {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .shop-subtitle {
            color: var(--gray);
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        
        /* Shop Controls */
        .shop-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
        }
        
        .total-products {
            font-size: 1.1rem;
            color: var(--gray);
        }
        
        .total-products strong {
            color: var(--primary);
        }
        
        .sort-filter {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .sort-select {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }
        
        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-bottom: 50px;
        }
        
        /* Product Card */
        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
        }
        
        /* Product Image Container */
        .product-img-container {
            position: relative;
            height: 250px;
            overflow: hidden;
            background: linear-gradient(135deg, #1e293b, #0f172a);
        }
        
        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 20px;
            transition: transform 0.5s ease;
        }
        
        .product-card:hover .product-image {
            transform: scale(1.05);
        }
        
        /* Quick View Button */
        .quick-view-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-card:hover .quick-view-btn {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Wishlist Button */
        .wishlist-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-card:hover .wishlist-btn {
            opacity: 1;
            transform: translateY(0);
        }
        
        .wishlist-btn.active {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }
        
        /* Product Badges */
        .product-badge {
            position: absolute;
            top: 15px;
            left: 60px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            z-index: 2;
        }
        
        .badge-new {
            background: #10b981;
            color: white;
        }
        
        .badge-sale {
            background: #ef4444;
            color: white;
        }
        
        .badge-trending {
            background: #f59e0b;
            color: black;
        }
        
        /* Product Info */
        .product-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .product-category {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
            color: white;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 3em;
        }
        
        /* Rating */
        .product-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .stars {
            color: #f59e0b;
            font-size: 0.9rem;
        }
        
        .rating-count {
            color: var(--gray);
            font-size: 0.8rem;
        }
        
        /* Product Features */
        .product-features {
            list-style: none;
            margin-bottom: 15px;
            padding: 0;
        }
        
        .product-features li {
            color: var(--gray);
            font-size: 0.85rem;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .product-features li i {
            color: var(--primary);
            font-size: 0.7rem;
        }
        
        /* Price Section */
        .price-section {
            margin-top: auto;
        }
        
        .current-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
        }
        
        .original-price {
            font-size: 1rem;
            color: var(--gray);
            text-decoration: line-through;
            margin-left: 10px;
        }
        
        .discount {
            color: #10b981;
            font-size: 0.9rem;
            font-weight: 600;
            margin-left: 10px;
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .add-to-cart-btn {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .add-to-cart-btn:hover {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            transform: translateY(-2px);
        }
        
        .buy-now-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .buy-now-btn:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-2px);
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 40px;
        }
        
        .pagination-btn {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .pagination-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
        }
        
        .pagination-btn.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-color: transparent;
        }
        
        /* Sidebar Filter */
        .shop-sidebar {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .filter-section {
            margin-bottom: 25px;
        }
        
        .filter-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .filter-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        
        .filter-option input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        
        .filter-option label {
            color: var(--gray);
            cursor: pointer;
        }
        
        .filter-option:hover label {
            color: white;
        }
        
        /* Price Range */
        .price-range {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        .price-input {
            width: 100px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: white;
        }
        
        /* Color Options */
        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .color-option:hover {
            transform: scale(1.1);
        }
        
        .color-option.active {
            border-color: white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        /* Responsive Design */
        @media (max-width: 1200px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (max-width: 992px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .shop-controls {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .sort-filter {
                width: 100%;
                justify-content: space-between;
            }
        }
        
        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .product-img-container {
                height: 200px;
            }
            
            .shop-title {
                font-size: 2.5rem;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
        
        @media (max-width: 576px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
            
            .shop-container {
                padding: 0 15px;
            }
            
            .product-img-container {
                height: 250px;
            }
        }
        
        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

        </div>

        <!-- Main Content -->

                <!-- Products will be loaded here -->
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination">
                <!-- Pagination buttons will be loaded here -->
            </div>
        </div>
    </div>

        </div>
        <div class="ai-chat">

        </div>
        <div class="ai-input">
            <input type="text" placeholder="Search or ask about products...">
            <button><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

                    reviewCount: 78,
                    badge: "trending",
                    color: "#0d9488"
                }
            ];
            
            let currentProducts = [...allProducts];
            let currentPage = 1;
            const productsPerPage = 12;
            const totalPages = Math.ceil(allProducts.length / productsPerPage);
            
            // Initialize
            updateProductCount();
            loadProducts();
            setupPagination();
            setupEventListeners();
            
            // Load products function
            function loadProducts() {
                const grid = document.getElementById('productGrid');
                if (!grid) return;
                
                // Calculate start and end index
                const startIndex = (currentPage - 1) * productsPerPage;
                const endIndex = startIndex + productsPerPage;
                const pageProducts = currentProducts.slice(startIndex, endIndex);
                
                grid.innerHTML = pageProducts.map(product => {
                    const discount = product.originalPrice ? 
                        Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100) : 0;
                    
                    return `
                        <div class="product-card" data-id="${product.id}" data-category="${product.category}">
                            <!-- Product Badge -->
                            ${product.badge ? `
                                <div class="product-badge badge-${product.badge}">
                                    ${product.badge.charAt(0).toUpperCase() + product.badge.slice(1)}
                                </div>
                            ` : ''}
                            
                            <!-- Wishlist Button -->
                            <button class="wishlist-btn" onclick="toggleWishlist(${product.id})">
                                <i class="far fa-heart"></i>
                            </button>
                            
                            <!-- Quick View Button -->
                            <button class="quick-view-btn" onclick="quickView(${product.id})">
                                <i class="fas fa-eye"></i>
                            </button>
                            
                            <!-- Product Image -->
                            <div class="product-img-container">
                                <img src="${product.image}" alt="${product.name}" class="product-image">
                            </div>
                            
                            <!-- Product Info -->
                            <div class="product-info">
                                <div class="product-category">${product.category.toUpperCase()}</div>
                                <h3 class="product-name">${product.name}</h3>
                                
                                <!-- Rating -->
                                <div class="product-rating">
                                    <div class="stars">
                                        ${getStars(product.rating)}
                                    </div>
                                    <span class="rating-count">(${product.reviewCount})</span>
                                </div>
                                
                                <!-- Features -->
                                ${product.features ? `
                                    <ul class="product-features">
                                        ${product.features.slice(0, 2).map(feature => `
                                            <li><i class="fas fa-check"></i> ${feature}</li>
                                        `).join('')}
                                    </ul>
                                ` : ''}
                                
                                <!-- Price Section -->
                                <div class="price-section">
                                    <div>
                                        <span class="current-price">$${product.price}</span>
                                        ${product.originalPrice ? `
                                            <span class="original-price">$${product.originalPrice}</span>
                                            ${discount > 0 ? `<span class="discount">-${discount}%</span>` : ''}
                                        ` : ''}
                                    </div>
                                </div>
                                
                                <!-- Action Buttons -->
                                <div class="action-buttons">
                                    <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                                        <i class="fas fa-shopping-cart"></i>
                                        Add to Cart
                                    </button>
                                    <button class="buy-now-btn" onclick="buyNow(${product.id})">
                                        Buy Now
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                // Update showing count
                document.getElementById('showingCount').textContent = pageProducts.length;
            }
            
            // Get stars HTML
            function getStars(rating) {
                const fullStars = Math.floor(rating);
                const hasHalfStar = rating % 1 >= 0.5;
                const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);
                
                let stars = '';
                
                // Full stars
                for (let i = 0; i < fullStars; i++) {
                    stars += '<i class="fas fa-star"></i>';
                }
                
                // Half star
                if (hasHalfStar) {
                    stars += '<i class="fas fa-star-half-alt"></i>';
                }
                
                // Empty stars
                for (let i = 0; i < emptyStars; i++) {
                    stars += '<i class="far fa-star"></i>';
                }
                
                return stars;
            }
            
            // Setup pagination
            function setupPagination() {
                const pagination = document.getElementById('pagination');
                if (!pagination) return;
                
                let paginationHTML = '';
                
                // Previous button
                paginationHTML += `
                    <button class="pagination-btn prev-btn" ${currentPage === 1 ? 'disabled' : ''}>
                        <i class="fas fa-chevron-left"></i>
                    </button>
                `;
                
                // Page numbers
                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                        paginationHTML += `
                            <button class="pagination-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">
                                ${i}
                            </button>
                        `;
                    } else if (i === currentPage - 2 || i === currentPage + 2) {
                        paginationHTML += `<span class="pagination-dots">...</span>`;
                    }
                }
                
                // Next button
                paginationHTML += `
                    <button class="pagination-btn next-btn" ${currentPage === totalPages ? 'disabled' : ''}>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                `;
                
                pagination.innerHTML = paginationHTML;
                
                // Add event listeners
                document.querySelectorAll('.pagination-btn[data-page]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentPage = parseInt(btn.dataset.page);
                        loadProducts();
                        setupPagination();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                });
                
                // Previous button
                document.querySelector('.prev-btn')?.addEventListener('click', () => {
                    if (currentPage > 1) {
                        currentPage--;
                        loadProducts();
                        setupPagination();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
                
                // Next button
                document.querySelector('.next-btn')?.addEventListener('click', () => {
                    if (currentPage < totalPages) {
                        currentPage++;
                        loadProducts();
                        setupPagination();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            }
            
            // Setup event listeners
            function setupEventListeners() {
                // Sort select
                document.getElementById('sortSelect')?.addEventListener('change', function() {
                    const value = this.value;
                    
                    switch(value) {
                        case 'price-low':
                            currentProducts.sort((a, b) => a.price - b.price);
                            break;
                        case 'price-high':
                            currentProducts.sort((a, b) => b.price - a.price);
                            break;
                        case 'rating':
                            currentProducts.sort((a, b) => b.rating - a.rating);
                            break;
                        case 'newest':
                            currentProducts.sort((a, b) => b.id - a.id);
                            break;
                        default:
                            currentProducts = [...allProducts];
                    }
                    
                    currentPage = 1;
                    loadProducts();
                    setupPagination();
                });
            }
            
            // Update product count
            function updateProductCount() {
                document.getElementById('totalCount').textContent = allProducts.length;
            }
            
            // Quick view function
            window.quickView = function(productId) {
                const product = allProducts.find(p => p.id === productId);
                if (!product) return;
                
                // In a real app, this would open a modal with more details
                alert(`Quick View: ${product.name}\nPrice: $${product.price}\nRating: ${product.rating}/5`);
            };
            
            // Toggle wishlist
            window.toggleWishlist = function(productId) {
                const btn = document.querySelector(`.product-card[data-id="${productId}"] .wishlist-btn`);
                if (!btn) return;
                
                const icon = btn.querySelector('i');
                
                if (icon.classList.contains('far')) {
                    // Add to wishlist
                    icon.classList.remove('far');
                    icon.classList.add('fas');
                    btn.classList.add('active');
                    
                    // Animation
                    if (typeof gsap !== 'undefined') {
                        gsap.to(btn, {
                            scale: 1.3,
                            duration: 0.2,
                            yoyo: true,
                            repeat: 1
                        });
                    }
                    
                    showNotification('Added to wishlist!');
                } else {
                    // Remove from wishlist
                    icon.classList.remove('fas');
                    icon.classList.add('far');
                    btn.classList.remove('active');
                    
                    showNotification('Removed from wishlist!');
                }
            };
            
            // Buy now function
            window.buyNow = function(productId) {
                addToCart(productId);
                setTimeout(() => {
                    window.location.href = 'checkout.html';
                }, 800);
            };
            
            // Show notification
            function showNotification(message) {
                if (typeof showNotification === 'function') {
                    window.showNotification(message);
                } else {
                    // Fallback
                    const notification = document.createElement('div');
                    notification.textContent = message;
                    notification.style.cssText = `
                        position: fixed;
                        bottom: 20px;
                        right: 20px;
                        background: linear-gradient(135deg, #6366f1, #8b5cf6);
                        color: white;
                        padding: 1rem 2rem;
                        border-radius: 10px;
                        z-index: 10000;
                    `;
                    
                    document.body.appendChild(notification);
                    
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 3000);
                }
            }
        });
    </script>
