<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - NEXUS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Cart Page Specific Styles */
        .cart-container {
            max-width: 1200px;
            margin: 100px auto 50px;
            padding: 0 2rem;
        }
        
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }
        
        .cart-title {
            font-size: 2.5rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 4rem;
        }
        
        .cart-items {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
        }
        
        .cart-item {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 2rem;
            align-items: center;
            padding: 2rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .cart-item:last-child {
            border-bottom: none;
        }
        
        .item-image {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            overflow: hidden;
            background: linear-gradient(45deg, #2d3748, #4a5568);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .item-image img {
            max-width: 80%;
            max-height: 80%;
        }
        
        .item-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .item-name {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .item-color {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        .color-preview {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        
        .item-quantity {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .quantity-btn {
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .quantity-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .quantity-input {
            width: 50px;
            height: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: white;
            text-align: center;
        }
        
        .item-price {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--secondary);
        }
        
        .item-remove {
            position: absolute;
            top: 2rem;
            right: 0;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1.2rem;
            opacity: 0.7;
            transition: all 0.3s ease;
        }
        
        .item-remove:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        
        .cart-summary {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 120px;
        }
        
        .summary-title {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--gray);
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .summary-total {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid var(--primary);
        }
        
        .checkout-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        
        .checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.3);
        }
        
        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .continue-shopping:hover {
            color: var(--primary);
        }
        
        .empty-cart {
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .empty-cart-icon {
            font-size: 4rem;
            color: var(--gray);
            margin-bottom: 2rem;
        }
        
        .empty-cart h2 {
            margin-bottom: 1rem;
            color: var(--gray);
        }
        
        .empty-cart p {
            color: var(--gray);
            margin-bottom: 2rem;
        }
        
        /* Animation for item removal */
        .item-removing {
            animation: slideOut 0.5s ease forwards;
        }
        
        @keyframes slideOut {
            0% {
                opacity: 1;
                transform: translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateX(100%);
            }
        }
        
        /* Responsive */
        @media (max-width: 992px) {
            .cart-content {
                grid-template-columns: 1fr;
            }
            
            .cart-item {
                grid-template-columns: auto 1fr;
                grid-template-rows: auto auto;
                gap: 1rem;
            }
            
            .item-price {
                grid-column: 1;
                grid-row: 2;
            }
            
            .item-quantity {
                grid-column: 2;
                grid-row: 2;
                justify-self: end;
            }
            
            .item-remove {
                top: 1rem;
                right: 1rem;
            }
        }
        
        @media (max-width: 576px) {
            .cart-item {
                grid-template-columns: 1fr;
                text-align: center;
            }
            
            .item-image {
                margin: 0 auto;
            }
            
            .item-quantity {
                justify-self: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>NEXUS</h1>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="cart.html" class="active">Cart</a>
                <a href="checkout.html" class="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
            <button class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Cart Container -->
    <div class="cart-container">
        <div class="cart-header">
            <h1 class="cart-title">Your Shopping Cart</h1>
            <button class="portal-btn" id="clearCartBtn">
                <i class="fas fa-trash"></i>
                Clear Cart
            </button>
        </div>
        
        <div class="cart-content">
            <!-- Cart Items -->
            <div class="cart-items" id="cartItems">
                <!-- Cart items will be loaded here -->
                <div class="empty-cart" id="emptyCart">
                    <div class="empty-cart-icon">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                    <h2>Your cart is empty</h2>
                    <p>Add some products to get started</p>
                    <a href="shop.html" class="portal-btn">
                        <i class="fas fa-shopping-bag"></i>
                        Start Shopping
                    </a>
                </div>
            </div>
            
            <!-- Cart Summary -->
            <div class="cart-summary" id="cartSummary">
                <h3 class="summary-title">Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span id="shipping">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax</span>
                    <span id="tax">$0.00</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="total">$0.00</span>
                </div>
                
                <button class="checkout-btn" id="checkoutBtn">
                    <i class="fas fa-lock"></i>
                    Proceed to Checkout
                </button>
                
                <a href="shop.html" class="continue-shopping">
                    <i class="fas fa-arrow-left"></i>
                    Continue Shopping
                </a>
            </div>
        </div>
    </div>

    <!-- AI Assistant Widget -->
    <div class="ai-widget" id="aiWidget">
        <div class="ai-header">
            <div class="ai-avatar">
                <i class="fas fa-robot"></i>
            </div>
            <h4>Cart Assistant</h4>
            <button class="close-ai"><i class="fas fa-times"></i></button>
        </div>
        <div class="ai-chat">
            <div class="ai-message">Need help with your cart? I can suggest products or answer questions!</div>
        </div>
        <div class="ai-input">
            <input type="text" placeholder="Ask about your cart...">
            <button><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load cart from localStorage
            let cart = JSON.parse(localStorage.getItem('nexusCart')) || [];
            
            // Update cart count
            function updateCartCount() {
                const cartCount = document.querySelector('.cart-count');
                if (cartCount) {
                    cartCount.textContent = cart.length;
                }
            }
            
            // Calculate cart totals
            function calculateTotals() {
                let subtotal = 0;
                
                cart.forEach(item => {
                    subtotal += item.price * item.quantity;
                });
                
                const shipping = subtotal > 0 ? 9.99 : 0;
                const tax = subtotal * 0.08; // 8% tax
                const total = subtotal + shipping + tax;
                
                return {
                    subtotal: subtotal.toFixed(2),
                    shipping: shipping.toFixed(2),
                    tax: tax.toFixed(2),
                    total: total.toFixed(2)
                };
            }
            
            // Update summary
            function updateSummary() {
                const totals = calculateTotals();
                
                document.getElementById('subtotal').textContent = `$${totals.subtotal}`;
                document.getElementById('shipping').textContent = `$${totals.shipping}`;
                document.getElementById('tax').textContent = `$${totals.tax}`;
                document.getElementById('total').textContent = `$${totals.total}`;
            }
            
            // Load cart items
            function loadCartItems() {
                const cartItems = document.getElementById('cartItems');
                const emptyCart = document.getElementById('emptyCart');
                const cartSummary = document.getElementById('cartSummary');
                
                if (cart.length === 0) {
                    cartItems.innerHTML = `
                        <div class="empty-cart" id="emptyCart">
                            <div class="empty-cart-icon">
                                <i class="fas fa-shopping-cart"></i>
                            </div>
                            <h2>Your cart is empty</h2>
                            <p>Add some products to get started</p>
                            <a href="shop.html" class="portal-btn">
                                <i class="fas fa-shopping-bag"></i>
                                Start Shopping
                            </a>
                        </div>
                    `;
                    cartSummary.style.display = 'none';
                    return;
                }
                
                cartSummary.style.display = 'block';
                
                cartItems.innerHTML = cart.map((item, index) => `
                    <div class="cart-item" data-index="${index}">
                        <button class="item-remove" data-index="${index}">
                            <i class="fas fa-times"></i>
                        </button>
                        
                        <div class="item-image">
                            <img src="${item.image || 'https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=200'}" alt="${item.name}">
                        </div>
                        
                        <div class="item-details">
                            <h3 class="item-name">${item.name}</h3>
                            <div class="item-color">
                                <span>Color:</span>
                                <div class="color-preview" style="background: ${item.color};"></div>
                                <span>${item.color.toUpperCase()}</span>
                            </div>
                            ${item.size ? `<div class="item-size">Size: ${item.size}</div>` : ''}
                        </div>
                        
                        <div class="item-quantity">
                            <button class="quantity-btn decrease" data-index="${index}">-</button>
                            <input type="number" class="quantity-input" value="${item.quantity}" min="1" max="10" data-index="${index}">
                            <button class="quantity-btn increase" data-index="${index}">+</button>
                        </div>
                        
                        <div class="item-price">$${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                `).join('');
                
                updateSummary();
            }
            
            // Remove item from cart
            function removeItem(index) {
                const itemElement = document.querySelector(`.cart-item[data-index="${index}"]`);
                
                if (itemElement) {
                    // Add removal animation
                    itemElement.classList.add('item-removing');
                    
                    setTimeout(() => {
                        cart.splice(index, 1);
                        localStorage.setItem('nexusCart', JSON.stringify(cart));
                        loadCartItems();
                        updateCartCount();
                        
                        // Show notification
                        showNotification('Item removed from cart');
                    }, 500);
                }
            }
            
            // Update quantity
            function updateQuantity(index, newQuantity) {
                if (newQuantity < 1 || newQuantity > 10) return;
                
                cart[index].quantity = newQuantity;
                localStorage.setItem('nexusCart', JSON.stringify(cart));
                loadCartItems();
                updateCartCount();
                
                // Animate price update
                const priceElement = document.querySelector(`.cart-item[data-index="${index}"] .item-price`);
                if (priceElement) {
                    gsap.fromTo(priceElement,
                        { scale: 1.2, color: '#f59e0b' },
                        { scale: 1, color: '#f59e0b', duration: 0.3, onComplete: () => {
                            gsap.to(priceElement, { color: '#f59e0b', duration: 0.3 });
                        }}
                    );
                }
            }
            
            // Clear cart
            function clearCart() {
                if (cart.length === 0) return;
                
                // Animation for clearing cart
                const cartItems = document.querySelectorAll('.cart-item');
                
                gsap.to(cartItems, {
                    opacity: 0,
                    x: 100,
                    stagger: 0.1,
                    duration: 0.5,
                    onComplete: () => {
                        cart = [];
                        localStorage.setItem('nexusCart', JSON.stringify(cart));
                        loadCartItems();
                        updateCartCount();
                        showNotification('Cart cleared');
                    }
                });
            }
            
            // Show notification
            function showNotification(message) {
                const notification = document.createElement('div');
                notification.textContent = message;
                notification.style.cssText = `
                    position: fixed;
                    bottom: 2rem;
                    right: 2rem;
                    background: var(--gradient);
                    color: white;
                    padding: 1rem 2rem;
                    border-radius: 10px;
                    z-index: 10000;
                    transform: translateY(100px);
                    opacity: 0;
                `;
                
                document.body.appendChild(notification);
                
                gsap.to(notification, {
                    y: 0,
                    opacity: 1,
                    duration: 0.5,
                    ease: "power2.out",
                    onComplete: () => {
                        setTimeout(() => {
                            gsap.to(notification, {
                                y: 100,
                                opacity: 0,
                                duration: 0.5,
                                onComplete: () => {
                                    document.body.removeChild(notification);
                                }
                            });
                        }, 2000);
                    }
                });
            }
            
            // Event delegation for cart items
            document.getElementById('cartItems').addEventListener('click', function(e) {
                // Remove item
                if (e.target.closest('.item-remove')) {
                    const button = e.target.closest('.item-remove');
                    const index = parseInt(button.dataset.index);
                    removeItem(index);
                }
                
                // Decrease quantity
                if (e.target.closest('.decrease')) {
                    const button = e.target.closest('.decrease');
                    const index = parseInt(button.dataset.index);
                    const input = button.parentElement.querySelector('.quantity-input');
                    const newQuantity = parseInt(input.value) - 1;
                    
                    if (newQuantity >= 1) {
                        updateQuantity(index, newQuantity);
                    }
                }
                
                // Increase quantity
                if (e.target.closest('.increase')) {
                    const button = e.target.closest('.increase');
                    const index = parseInt(button.dataset.index);
                    const input = button.parentElement.querySelector('.quantity-input');
                    const newQuantity = parseInt(input.value) + 1;
                    
                    if (newQuantity <= 10) {
                        updateQuantity(index, newQuantity);
                    }
                }
            });
            
            // Quantity input change
            document.getElementById('cartItems').addEventListener('change', function(e) {
                if (e.target.classList.contains('quantity-input')) {
                    const index = parseInt(e.target.dataset.index);
                    const newQuantity = parseInt(e.target.value);
                    updateQuantity(index, newQuantity);
                }
            });
            
            // Clear cart button
            document.getElementById('clearCartBtn').addEventListener('click', function() {
                if (cart.length === 0) {
                    showNotification('Cart is already empty');
                    return;
                }
                
                if (confirm('Are you sure you want to clear your cart?')) {
                    clearCart();
                }
            });
            
            // Checkout button
            document.getElementById('checkoutBtn').addEventListener('click', function() {
                if (cart.length === 0) {
                    showNotification('Add items to cart before checkout');
                    return;
                }
                
                // Animate button
                gsap.to(this, {
                    scale: 0.95,
                    duration: 0.1,
                    yoyo: true,
                    repeat: 1,
                    onComplete: () => {
                        // Redirect to checkout
                        window.location.href = 'checkout.html';
                    }
                });
            });
            
            // Initialize
            loadCartItems();
            updateCartCount();
            
            // Initialize AI Assistant
            if (typeof initAIAssistant === 'function') {
                initAIAssistant();
            }
        });
    </script>
</body>
</html>
