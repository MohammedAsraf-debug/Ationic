# Netlify deployment configuration for the Ationic static site.
# Headers below apply to the published site. They are tuned so they do NOT
# break: Google Analytics, Microsoft Clarity, EmailJS, Google Fonts,
# and Font Awesome. Blog content is rendered server-side from WordPress.

[build]
  publish = "."
  command = "npm run build"

[build.environment]
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Set WORDPRESS_API_URL in the Netlify UI (Site settings > Environment
# variables), e.g. https://cms.example.com/wp-json/wp/v2

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/blog"
  to = "/.netlify/functions/blog"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/.netlify/functions/blog/:splat"
  status = 200
  force = true


[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Inline analytics/oninput handlers migrated to js/analytics.js +
    # js/enhancements.js, so script-src no longer needs 'unsafe-inline'.
    # style-src keeps it (many scoped inline styles + Font Awesome).
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms https://cdn.jsdelivr.net https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://api.emailjs.com https://*.clarity.ms wss://*.clarity.ms https://identity.netlify.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://api.emailjs.com; upgrade-insecure-requests"