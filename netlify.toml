# Netlify deployment configuration for the Ationic static site.
# Headers below apply to the published site. They are tuned so they do NOT
# break: Google Analytics, Microsoft Clarity, EmailJS, Google Fonts,
# Font Awesome, Netlify Identity, and the Decap CMS admin app.

[build]
  publish = "."
  command = "npm run build"

[build.environment]
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/media/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/blog"
  to = "/.netlify/functions/blog"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/.netlify/functions/blog/:splat"
  status = 200
  force = true


[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # NOTE: 'unsafe-inline' for script-src is required today because the site
    # ships inline GA/Clarity config plus inline oninput handlers. Migrating
    # these to hashes/nonces would allow a stricter policy.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://api.emailjs.com https://*.clarity.ms wss://*.clarity.ms https://identity.netlify.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://api.emailjs.com; upgrade-insecure-requests"